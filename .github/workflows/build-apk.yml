name: Build Android APK and Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Arushi AI Build v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Automated Android debug APK build from commit ${{ github.sha }}." \
            --latest \
            app/build/outputs/apk/debug/app-debug.apk

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            echo "### Release Publishing Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "Release Tag: ${{ env.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
            echo "Release Title: ${{ env.RELEASE_TITLE }}" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the GitHub Release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup." >> $GITHUB_STEP_SUMMARY
            
            gh release view "${{ env.RELEASE_TAG }}" || true
          else
            echo "### ⚠️ Warning: Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded successfully and the Actions artifact named **app-debug-apk** remains available for download." >> $GITHUB_STEP_SUMMARY
            echo "Release publishing encountered an error, but the build output is fully preserved." >> $GITHUB_STEP_SUMMARY
          fi
